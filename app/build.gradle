import java.util.stream.Collectors

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    def apk = "AppRetention"

    Properties properties = new Properties()
    File localProps = project.rootProject.file('local.properties')
    if (localProps.exists()) {
        localProps.withInputStream { properties.load(it) }
    }

    def keyStorePath = properties.getProperty('keyStoreFile', 'release.jks')
    def keyKeyStoreFile = project.rootProject.file(keyStorePath)
    def keyKeyStorePassword = properties.getProperty('keyStorePassword', '123456')
    def keyKeyAlias = properties.getProperty('keyAlias', 'appretention')
    def keyKeyAliasPassword = properties.getProperty('keyAliasPassword', '123456')

    signingConfigs {
        release {
            if (keyKeyStoreFile.exists()) {
                storeFile keyKeyStoreFile
                storePassword keyKeyStorePassword
                keyAlias keyKeyAlias
                keyPassword keyKeyAliasPassword
            }
            enableV2Signing true
            enableV3Signing true
            enableV4Signing true
        }
    }

    namespace 'com.hchen.appretention'
    compileSdk 34

    defaultConfig {
        applicationId "com.hchen.appretention"
        minSdk 29
        targetSdk 34
        //noinspection HighAppVersionCode
        versionCode 2025040100
        versionName "5.2.3-Preview"
        ndk {
            // noinspection ChromeOsAbiSupport
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        signingConfig signingConfigs.release
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            merges += "META-INF/xposed/*"
            excludes += "/kotlin/**"
            excludes += "/*.txt"
            excludes += "/*.bin"
            excludes += "/*.json"
        }
    }

    android {
        applicationVariants.configureEach { variant ->
            variant.outputs.configureEach { output ->
                outputFileName = "${apk}-v${variant.versionName}(${variant.versionCode})_${variant.buildType.name}.apk"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_21.toString()
    }

    buildFeatures {
        buildConfig true
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

tasks.matching { it.name.startsWith("check") && it.name.endsWith("AarMetadata") }.configureEach {
    enabled = false
}

dependencies {
    compileOnly 'io.github.libxposed:api:101.0.0'
    compileOnly 'de.robv.android.xposed:api:82'
    implementation 'org.luckypray:dexkit:2.0.3'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.1'

    implementation(project(':HookTool'))
    implementation(project(':app:collect'))
    annotationProcessor(project(':app:collect'))
}
